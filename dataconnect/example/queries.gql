mutation AddNewVitalSign @auth(level: USER) {
  vitalSign_insert(data: {clientProfileId_expr: "auth.uid", type: "Blood Pressure", value: 120.0, recordedAt_expr: "request.time"})
}

query GetMyMedications @auth(level: USER) {
  medications(where: {clientProfileId: {eq_expr: "auth.uid"}}) {
    id
    name
    dosage
    frequency
  }
}

mutation UpdateMedicationNotes($id: UUID!, $notes: String) @auth(level: USER, insecureReason: "Allows updating notes for a specific medication record identified by its ID.") {
  medication_update(key: {id: $id}, data: {notes: $notes})
}

query ListCaregiversForClientProfile($clientProfileId: UUID!) @auth(level: USER, insecureReason: "Exposes caregivers tied to the supplied client profile ID for authorized users.") {
  caregiverRelationships(where: {clientProfileId: {eq: $clientProfileId}}) {
    caregiver {
      id
      displayName
      email
    }
    accessLevel
  }
}

# User Profile Queries
query GetUserProfile($firebaseUid: String!) @auth(level: USER, insecureReason: "Fetches a specific user by Firebase UID for administrative or self-service lookups.") {
  users(where: {firebaseUid: {eq: $firebaseUid}}) {
    id
    firebaseUid
    displayName
    userType
    email
    photoUrl
    dateOfBirth
    createdAt
  }
}

query GetCurrentUser @auth(level: USER) {
  users(where: {firebaseUid: {eq_expr: "auth.uid"}}) {
    id
    firebaseUid
    displayName
    userType
    email
    photoUrl
    dateOfBirth
    createdAt
  }
}

# Client Profile Queries
query GetClientProfile($clientId: UUID!) @auth(level: USER, insecureReason: "Returns a single client profile for the provided client ID; callers must supply an ID.") {
  clientProfiles(where: {id: {eq: $clientId}}) {
    id
    user {
      id
      displayName
      email
    }
    emergencyContactName
    emergencyContactPhone
    primaryCareDoctor
    allergies
    medicalConditions
  }
}

# Medication Queries
query GetClientMedications($clientProfileId: UUID!) @auth(level: USER, insecureReason: "Lists medications only for the requested client profile ID.") {
  medications(where: {clientProfileId: {eq: $clientProfileId}}) {
    id
    name
    dosage
    frequency
    startTime
    instructions
    notes
    endDate
  }
}

# Vital Signs Queries
query GetClientVitalSigns($clientProfileId: UUID!) @auth(level: USER, insecureReason: "Retrieves vital signs scoped to the provided client profile ID.") {
  vitalSigns(where: {clientProfileId: {eq: $clientProfileId}}) {
    id
    type
    value
    unit
    recordedAt
    notes
  }
}

# Appointment Queries
query GetClientAppointments($clientProfileId: UUID!) @auth(level: USER, insecureReason: "Returns appointments only for the specified client profile ID.") {
  appointments(where: {clientProfileId: {eq: $clientProfileId}}) {
    id
    dateTime
    type
    location
    doctorName
    notes
  }
}

# Caregiver Relationship Queries
query GetCaregiverClients($caregiverId: UUID!) @auth(level: USER, insecureReason: "Provides client relationships only for the supplied caregiver ID.") {
  caregiverRelationships(where: {caregiverId: {eq: $caregiverId}}) {
    clientProfile {
      id
      user {
        displayName
        email
      }
      emergencyContactName
      emergencyContactPhone
    }
    establishedAt
    accessLevel
  }
}