<!DOCTYPE html>
<html>
<head>
  <title>Quick Institution Assignment</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: Arial; padding: 40px; max-width: 600px; margin: 0 auto; }
    button { padding: 10px 20px; margin: 10px 0; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 4px; }
    button:hover { background: #45a049; }
    .output { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 4px; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>🚀 Quick Institution Assignment</h1>
  <p>This will assign your account to an institution directly in Firestore.</p>
  
  <button onclick="assignInstitution()">Assign Institution to My Account</button>
  
  <div id="output" class="output"></div>

  <script>
    const firebaseConfig = {
      apiKey: "***REMOVED***",
      authDomain: "elderx-f5c2b.firebaseapp.com",
      projectId: "elderx-f5c2b",
      storageBucket: "elderx-f5c2b.firebasestorage.app",
      messagingSenderId: "987610993096",
      appId: "1:987610993096:web:97c82732772d1223d3f0fd"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function log(message, isError = false) {
      const output = document.getElementById('output');
      const className = isError ? 'error' : 'success';
      output.innerHTML += `<div class="${className}">${message}</div>`;
    }

    async function assignInstitution() {
      try {
        document.getElementById('output').innerHTML = '';
        log('🔍 Checking current user...');
        
        const user = auth.currentUser;
        if (!user) {
          log('❌ Not logged in! Please sign in to https://elderx-f5c2b.web.app first, then come back to this page.', true);
          return;
        }
        
        log(`✅ Logged in as: ${user.email}`);
        
        // Check for institutions
        log('📋 Looking for institutions...');
        const institutionsSnapshot = await db.collection('institutions').limit(1).get();
        
        let institutionId;
        let institutionName;
        
        if (institutionsSnapshot.empty) {
          log('🏗️ No institutions found. Creating one...');
          
          const newInstitutionRef = await db.collection('institutions').add({
            name: 'Test Healthcare Institution',
            domain: 'test.healthcare.com',
            slug: 'test-healthcare',
            active: true,
            createdAt: firebase.firestore.Timestamp.now(),
            updatedAt: firebase.firestore.Timestamp.now()
          });
          
          institutionId = newInstitutionRef.id;
          institutionName = 'Test Healthcare Institution';
          log(`✅ Created institution: ${institutionId}`);
          
          // Create license
          await db.collection('licenses').add({
            institutionId,
            plan: 'enterprise',
            seats: 100,
            startsAt: firebase.firestore.Timestamp.now(),
            endsAt: firebase.firestore.Timestamp.fromDate(new Date('2026-12-31')),
            features: {},
            status: 'active',
            active: true,
            createdAt: firebase.firestore.Timestamp.now(),
            updatedAt: firebase.firestore.Timestamp.now()
          });
          log('✅ Created license');
          
        } else {
          const firstDoc = institutionsSnapshot.docs[0];
          institutionId = firstDoc.id;
          institutionName = firstDoc.data().name;
          log(`✅ Found institution: ${institutionName} (${institutionId})`);
        }
        
        // Update user document
        log('📝 Updating your user profile...');
        await db.collection('users').doc(user.uid).set({
          email: user.email,
          institutionId,
          institutionAdmin: true,
          type: 'admin',
          userType: 'admin',
          role: 'admin',
          superAdmin: true,
          active: true,
          updatedAt: firebase.firestore.Timestamp.now()
        }, { merge: true });
        
        log('✅ SUCCESS! Your account is now assigned to: ' + institutionName);
        log('');
        log('🎉 ALL DONE!');
        log('💡 Close this page and refresh your main app (Ctrl+Shift+R)');
        log('💡 You can now access /institution-admin');
        
      } catch (error) {
        log('❌ Error: ' + error.message, true);
        console.error(error);
      }
    }

    // Auto-check if user is logged in when page loads
    auth.onAuthStateChanged((user) => {
      if (user) {
        log(`🔐 Detected logged in user: ${user.email}`);
        log('👆 Click the button above to assign institution');
      } else {
        log('⚠️ Not logged in. Please sign in to https://elderx-f5c2b.web.app first, then return to this page.', true);
      }
    });
  </script>
</body>
</html>
