<!DOCTYPE html>
<html>
<head>
  <title>Fix Institution Link</title>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "***REMOVED***",
      authDomain: "elderx-f5c2b.firebaseapp.com",
      projectId: "elderx-f5c2b",
      storageBucket: "elderx-f5c2b.firebasestorage.app",
      messagingSenderId: "987610993096",
      appId: "1:987610993096:web:97c82732772d1223d3f0fd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const INSTITUTION_ID = 'YlRg0VHMK9BrvPQuYXqm';

    window.fixInstitutionLink = async function() {
      try {
        const user = auth.currentUser;
        if (!user) {
          alert('Please log in to https://elderx-f5c2b.web.app/super-admin first!');
          return;
        }

        document.getElementById('output').innerHTML = '🔄 Updating institution link...';

        const institutionRef = doc(db, 'institutions', INSTITUTION_ID);
        await updateDoc(institutionRef, {
          accessLink: `https://elderx-f5c2b.web.app/onboard?institution=${INSTITUTION_ID}`,
          loginLink: `https://elderx-f5c2b.web.app/institution/login?institution=${INSTITUTION_ID}`,
          updatedAt: new Date()
        });

        document.getElementById('output').innerHTML = '✅ SUCCESS! Institution link updated!<br><br>' +
          'New link: <a href="https://elderx-f5c2b.web.app/onboard?institution=' + INSTITUTION_ID + '" target="_blank">https://elderx-f5c2b.web.app/onboard?institution=' + INSTITUTION_ID + '</a><br><br>' +
          'Click the link above to test!';
      } catch (error) {
        document.getElementById('output').innerHTML = '❌ Error: ' + error.message;
        console.error(error);
      }
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('status').innerHTML = '✅ Logged in as: ' + user.email;
      } else {
        document.getElementById('status').innerHTML = '❌ Not logged in. Please log in to super-admin first.';
      }
    });
  </script>
  <style>
    body { font-family: Arial; padding: 40px; max-width: 600px; margin: 0 auto; }
    button { padding: 15px 30px; font-size: 16px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 8px; }
    button:hover { background: #45a049; }
    #output { margin-top: 20px; padding: 20px; background: #f4f4f4; border-radius: 8px; min-height: 60px; }
    #status { margin: 20px 0; padding: 10px; background: #e3f2fd; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>🔧 Fix Institution Link</h1>
  <div id="status">Checking login status...</div>
  <button onclick="fixInstitutionLink()">Fix Institution Link Now</button>
  <div id="output"></div>
</body>
</html>
