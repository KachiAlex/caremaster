version: '3.8'

services:
  elderx-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elderx-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - elderx-network

networks:
  elderx-network:
    driver: bridge

