version: '3.8'

services:
  elderx-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elderx-app
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - elderx-network

networks:
  elderx-network:
    driver: bridge

