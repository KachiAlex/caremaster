version: "3.8"

# CareMaster — fully containerized stack.
#
# Services:
#   web     Nginx serving the built React app + reverse-proxying /api -> api:5000
#   api     Node/Express backend (src/backend-equivalent: backend/)
#   db      PostgreSQL 16 (persistent named volume)
#   coturn  TURN/STUN for WebRTC NAT traversal (host networking: relay needs
#           the full UDP port range, which can't be NAT-port-mapped)
#
# Quick start:
#   cp backend/.env backend/.env        # already exists in prod; required
#   docker compose up -d --build        # or: docker-compose up -d --build
#
# Production (getcaremaster.com): web mounts docker/web.prod.conf (TLS) and the
# host's /etc/letsencrypt certs read-only; certbot on the host keeps renewing.
# Non-TLS/dev: override the web volume with ./docker/web.conf and publish 80 only.

services:
  db:
    image: postgres:16-alpine
    container_name: caremaster-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elderx_app}
      POSTGRES_USER: ${POSTGRES_USER:-elderx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [caremaster]
    # Not published — only reachable inside the caremaster network.
    # For local dev, publish it with: docker-compose.dev.yml or -p 5432:5432

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caremaster-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Force the DB target at the container boundary — never 'localhost'.
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-elderx_app}
      DB_USER: ${POSTGRES_USER:-elderx_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      NODE_ENV: production
      PORT: "5000"
      # Set to "true" on first boot of a FRESH database to apply knex
      # migrations automatically. Leave false when restoring a dump.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    volumes:
      - api-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks: [caremaster]
    # Not published — web proxies /api to it. Never expose 5000 publicly.

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Same-origin API calls — nginx in this container proxies to api:5000.
        REACT_APP_API_URL: /api
        REACT_APP_API_BASE_URL: /api
        REACT_APP_ENVIRONMENT: production
    container_name: caremaster-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Production config with TLS; swap for ./docker/web.conf when running
      # plain HTTP (local/dev/behind another TLS terminator).
      - ./docker/web.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    networks: [caremaster]

  coturn:
    image: coturn/coturn:4.6
    container_name: caremaster-turn
    restart: unless-stopped
    # TURN relays allocate from the dynamic port range — host networking is
    # required (mapping 49k+ UDP ports through Docker NAT is not viable).
    network_mode: host
    volumes:
      # Reuses the existing host coturn config (keeps credentials out of git).
      # For a fresh host, copy docker/turnserver.conf.example to
      # /etc/turnserver.conf and set a strong credential first.
      - /etc/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

networks:
  caremaster:
    driver: bridge

volumes:
  pgdata:
  api-logs:
