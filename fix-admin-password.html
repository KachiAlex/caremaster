<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Admin Password - Care Master</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }
        .result.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
            display: block;
        }
        .result strong {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .result code {
            background: rgba(0,0,0,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Fix Admin Password</h1>
        <p class="subtitle">Update the admin user password in the database</p>
        
        <div class="input-group">
            <label for="email">Admin Email</label>
            <input type="email" id="email" value="admin@bulah.com" readonly>
        </div>
        
        <div class="input-group">
            <label for="newPassword">New Password</label>
            <input type="text" id="newPassword" placeholder="Enter new password" value="Admin@123">
        </div>
        
        <button id="fixButton" onclick="fixAdminPassword()">
            Fix Admin Password
        </button>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "REDACTED_API_KEY",
            authDomain: "elderx-f5c2b.firebaseapp.com",
            projectId: "elderx-f5c2b",
            storageBucket: "elderx-f5c2b.firebasestorage.app",
            messagingSenderId: "987610993096",
            appId: "1:987610993096:web:97c82732772d1223d3f0fd"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        async function fixAdminPassword() {
            const button = document.getElementById('fixButton');
            const result = document.getElementById('result');
            const email = document.getElementById('email').value;
            const newPassword = document.getElementById('newPassword').value;

            if (!newPassword || newPassword.length < 6) {
                result.className = 'result error';
                result.innerHTML = '<strong>❌ Error</strong>Password must be at least 6 characters long.';
                return;
            }

            button.disabled = true;
            button.innerHTML = '<span class="loader"></span>Fixing password...';
            result.className = 'result info';
            result.innerHTML = '<strong>🔄 Processing...</strong>Looking for admin user in database...';

            try {
                // Find admin user by email
                console.log('🔍 Looking for admin user with email:', email);
                const usersRef = db.collection('users');
                const snapshot = await usersRef.where('email', '==', email).get();

                if (snapshot.empty) {
                    result.className = 'result error';
                    result.innerHTML = '<strong>❌ Error</strong>No admin user found with email: ' + email;
                    button.disabled = false;
                    button.innerHTML = 'Fix Admin Password';
                    return;
                }

                result.innerHTML = '<strong>🔄 Processing...</strong>Admin user found. Updating password...';

                // Update the admin user's password
                for (const doc of snapshot.docs) {
                    const data = doc.data();
                    console.log('📋 Current admin data:', {
                        id: doc.id,
                        email: data.email,
                        userType: data.userType || data.type,
                        institutionId: data.institutionId
                    });

                    await usersRef.doc(doc.id).update({
                        password: newPassword,
                        userType: 'admin',
                        type: 'admin',
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    console.log('✅ Password updated successfully!');

                    result.className = 'result success';
                    result.innerHTML = `
                        <strong>✅ Success!</strong>
                        Admin password has been updated successfully!<br><br>
                        <strong>Login Credentials:</strong><br>
                        Email: <code>${email}</code><br>
                        Password: <code>${newPassword}</code><br><br>
                        <strong>User ID:</strong> <code>${doc.id}</code><br>
                        <strong>Institution ID:</strong> <code>${data.institutionId || 'Not set'}</code><br><br>
                        You can now log in to the admin portal with these credentials.
                    `;

                    button.innerHTML = '✅ Password Fixed!';
                    setTimeout(() => {
                        button.disabled = false;
                        button.innerHTML = 'Fix Admin Password';
                    }, 3000);
                    return;
                }

            } catch (error) {
                console.error('❌ Error:', error);
                result.className = 'result error';
                result.innerHTML = `
                    <strong>❌ Error</strong>
                    Failed to update password: ${error.message}<br><br>
                    <small>Check the browser console for more details.</small>
                `;
                button.disabled = false;
                button.innerHTML = 'Fix Admin Password';
            }
        }

        // Auto-run if URL has ?auto=true
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('auto') === 'true') {
                setTimeout(fixAdminPassword, 1000);
            }
        });
    </script>
</body>
</html>
