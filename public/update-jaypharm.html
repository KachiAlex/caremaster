<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Jaypharm User</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 30px;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin: 10px 0;
      font-weight: bold;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }
    .error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }
    .info {
      background: #d1ecf1;
      border: 1px solid #bee5eb;
      color: #0c5460;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 Update Jaypharm User</h1>
    <button id="updateBtn" onclick="updateJaypharm()">Update jaypharm@bulah.com</button>
    <div id="result"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDhfVlf5k8jTE8OzQpk6LTVqUDR96mhtlU",
      authDomain: "elderx-f5c2b.firebaseapp.com",
      projectId: "elderx-f5c2b",
      storageBucket: "elderx-f5c2b.firebasestorage.app",
      messagingSenderId: "634362688797",
      appId: "1:634362688797:web:0a4be3a7c3f7e72e0e93ab",
      measurementId: "G-F8S0CRQE4D"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.updateJaypharm = async function() {
      const btn = document.getElementById('updateBtn');
      const resultDiv = document.getElementById('result');
      
      btn.disabled = true;
      resultDiv.innerHTML = '<div class="info">⏳ Updating user...</div>';

      try {
        // Find the user by email
        const usersRef = collection(db, 'users');
        const q = query(usersRef, where('email', '==', 'jaypharm@bulah.com'));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          resultDiv.innerHTML = '<div class="error">❌ User not found with email: jaypharm@bulah.com</div>';
          btn.disabled = false;
          return;
        }

        const userDoc = querySnapshot.docs[0];
        const userId = userDoc.id;
        const currentData = userDoc.data();

        resultDiv.innerHTML = `<div class="info">📋 Found user: ${userId}\n\nCurrent data:\n${JSON.stringify(currentData, null, 2)}\n\nUpdating...</div>`;

        // Update the user document
        const userRef = doc(db, 'users', userId);
        const updateData = {
          userType: 'pharmacist',
          type: 'pharmacist',
          role: 'pharmacist',
          institutionId: 'YlRg0VHMK9BrvPQuYXqm',
          status: 'active',
          active: true,
          updatedAt: new Date().toISOString()
        };

        // If name doesn't exist, add it
        if (!currentData.name) {
          updateData.name = 'Jay Pharmacy';
        }

        await updateDoc(userRef, updateData);

        resultDiv.innerHTML = `<div class="success">✅ User updated successfully!\n\nUser ID: ${userId}\n\nUpdated fields:\n${JSON.stringify(updateData, null, 2)}\n\n🎉 jaypharm@bulah.com is now a pharmacist at institution YlRg0VHMK9BrvPQuYXqm</div>`;
      } catch (error) {
        console.error('Error:', error);
        resultDiv.innerHTML = `<div class="error">❌ Error updating user:\n\n${error.message}\n\n${error.stack}</div>`;
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
