<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Assignments</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 30px;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin: 10px 0;
      font-weight: bold;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }
    .error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }
    .info {
      background: #d1ecf1;
      border: 1px solid #bee5eb;
      color: #0c5460;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Check Assignments for Jaypharm</h1>
    <button id="checkBtn" onclick="checkAssignments()">Check Assignments</button>
    <button onclick="updateUserFields()" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">Update Type & Role Fields</button>
    <div id="result"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDhfVlf5k8jTE8OzQpk6LTVqUDR96mhtlU",
      authDomain: "elderx-f5c2b.firebaseapp.com",
      projectId: "elderx-f5c2b",
      storageBucket: "elderx-f5c2b.firebasestorage.app",
      messagingSenderId: "634362688797",
      appId: "1:634362688797:web:0a4be3a7c3f7e72e0e93ab",
      measurementId: "G-F8S0CRQE4D"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const PHARMACIST_ID = 'Rrd9XfBGcOPKhvaboHvFMbTVXAV2';

    window.checkAssignments = async function() {
      const btn = document.getElementById('checkBtn');
      const resultDiv = document.getElementById('result');
      
      btn.disabled = true;
      resultDiv.innerHTML = '<div class="info">⏳ Checking assignments...</div>';

      try {
        // Check clientAssignments collection
        const assignmentsRef = collection(db, 'clientAssignments');
        const q = query(assignmentsRef, where('caregiverId', '==', PHARMACIST_ID));
        const querySnapshot = await getDocs(q);

        console.log('Found assignments:', querySnapshot.size);

        if (querySnapshot.empty) {
          resultDiv.innerHTML = '<div class="info">📋 No assignments found for pharmacist ID: ' + PHARMACIST_ID + '\n\n⚠️ This means no clients have been assigned yet.\n\nPlease assign a client from the admin dashboard.</div>';
        } else {
          let assignmentsText = '✅ Found ' + querySnapshot.size + ' assignment(s):\n\n';
          querySnapshot.forEach((doc) => {
            assignmentsText += '📄 Assignment ID: ' + doc.id + '\n';
            assignmentsText += JSON.stringify(doc.data(), null, 2) + '\n\n';
          });
          resultDiv.innerHTML = '<div class="success">' + assignmentsText + '</div>';
        }

        // Also check user document
        const userRef = doc(db, 'users', PHARMACIST_ID);
        const userDoc = await (await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js')).getDoc(userRef);
        
        if (userDoc.exists()) {
          const userData = userDoc.data();
          resultDiv.innerHTML += '<div class="info">👤 User Document:\n\n' + JSON.stringify(userData, null, 2) + '</div>';
        }

      } catch (error) {
        console.error('Error:', error);
        resultDiv.innerHTML = '<div class="error">❌ Error checking assignments:\n\n' + error.message + '\n\n' + error.stack + '</div>';
      } finally {
        btn.disabled = false;
      }
    };

    window.updateUserFields = async function() {
      const resultDiv = document.getElementById('result');
      
      resultDiv.innerHTML = '<div class="info">⏳ Updating user fields...</div>';

      try {
        const userRef = doc(db, 'users', PHARMACIST_ID);
        const updateData = {
          type: 'pharmacist',
          role: 'pharmacist',
          updatedAt: new Date().toISOString()
        };

        await updateDoc(userRef, updateData);

        resultDiv.innerHTML = '<div class="success">✅ User fields updated successfully!\n\nUpdated:\n' + JSON.stringify(updateData, null, 2) + '\n\nNow try logging in to the pharmacy dashboard again.</div>';
      } catch (error) {
        console.error('Error:', error);
        resultDiv.innerHTML = '<div class="error">❌ Error updating user:\n\n' + error.message + '\n\n' + error.stack + '</div>';
      }
    };
  </script>
</body>
</html>
