<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Admin Password - Care Master</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #2563eb;
      margin-bottom: 10px;
    }
    .info-box {
      background: #dbeafe;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      border-left: 4px solid #2563eb;
    }
    .result-box {
      background: #f0fdf4;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      border-left: 4px solid #16a34a;
      display: none;
    }
    .error-box {
      background: #fef2f2;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      border-left: 4px solid #dc2626;
      display: none;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .user-info {
      background: #f9fafb;
      padding: 10px;
      border-radius: 6px;
      margin: 10px 0;
      font-size: 13px;
    }
    .field {
      margin: 5px 0;
    }
    .field strong {
      display: inline-block;
      width: 150px;
      color: #6b7280;
    }
    .update-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid #e5e7eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Check Admin Password</h1>
    <p style="color: #6b7280;">Check and update the password for admin@bulah.com</p>

    <div class="info-box">
      <strong>📋 Instructions:</strong><br>
      This tool will check what password is currently stored in Firestore for admin@bulah.com and allow you to update it if needed.
    </div>

    <div>
      <label for="institutionId"><strong>Institution ID:</strong></label>
      <input type="text" id="institutionId" value="YlRg0VHMK9BrvPQuYXqm" placeholder="Enter institution ID">
    </div>

    <button id="checkBtn" onclick="checkPassword()">Check Current Password</button>

    <div id="resultBox" class="result-box"></div>
    <div id="errorBox" class="error-box"></div>

    <div id="updateSection" class="update-section" style="display: none;">
      <h3>Update Password</h3>
      <div>
        <label for="newPassword"><strong>New Password:</strong></label>
        <input type="text" id="newPassword" placeholder="Enter new password">
      </div>
      <button id="updateBtn" onclick="updatePassword()">Update Password in Firestore</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "REDACTED_API_KEY",
      authDomain: "elderx-f5c2b.firebaseapp.com",
      projectId: "elderx-f5c2b",
      storageBucket: "elderx-f5c2b.firebasestorage.app",
      messagingSenderId: "742649646326",
      appId: "1:742649646326:web:aa0cdcaa31a41e1a07c01a",
      measurementId: "G-7YDTNLRQ3E"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = null;

    window.checkPassword = async function() {
      const institutionId = document.getElementById('institutionId').value.trim();
      const resultBox = document.getElementById('resultBox');
      const errorBox = document.getElementById('errorBox');
      const updateSection = document.getElementById('updateSection');
      const checkBtn = document.getElementById('checkBtn');

      if (!institutionId) {
        errorBox.textContent = '❌ Please enter an institution ID';
        errorBox.style.display = 'block';
        resultBox.style.display = 'none';
        return;
      }

      try {
        checkBtn.disabled = true;
        checkBtn.textContent = 'Checking...';

        const usersRef = collection(db, 'users');
        const q = query(usersRef, where('email', '==', 'admin@bulah.com'));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          errorBox.textContent = '❌ No user found with email: admin@bulah.com';
          errorBox.style.display = 'block';
          resultBox.style.display = 'none';
          updateSection.style.display = 'none';
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          currentUser = { id: doc.id, ...data };

          let html = '<strong>✅ User Found:</strong><br><br>';
          html += '<div class="user-info">';
          html += `<div class="field"><strong>User ID:</strong> ${doc.id}</div>`;
          html += `<div class="field"><strong>Email:</strong> ${data.email}</div>`;
          html += `<div class="field"><strong>Name:</strong> ${data.name || data.displayName || 'N/A'}</div>`;
          html += `<div class="field"><strong>Type:</strong> ${data.type || data.userType || 'N/A'}</div>`;
          html += `<div class="field"><strong>Role:</strong> ${data.role || 'N/A'}</div>`;
          html += `<div class="field"><strong>Institution ID:</strong> ${data.institutionId || 'N/A'}</div>`;
          html += `<div class="field"><strong>Current Password:</strong> <code style="background: #fef3c7; padding: 2px 6px; border-radius: 3px;">${data.password || 'NOT SET'}</code></div>`;
          html += '</div>';

          resultBox.innerHTML = html;
          resultBox.style.display = 'block';
          errorBox.style.display = 'none';
          updateSection.style.display = 'block';
        });

      } catch (error) {
        console.error('Error:', error);
        errorBox.textContent = `❌ Error: ${error.message}`;
        errorBox.style.display = 'block';
        resultBox.style.display = 'none';
        updateSection.style.display = 'none';
      } finally {
        checkBtn.disabled = false;
        checkBtn.textContent = 'Check Current Password';
      }
    };

    window.updatePassword = async function() {
      const newPassword = document.getElementById('newPassword').value.trim();
      const resultBox = document.getElementById('resultBox');
      const errorBox = document.getElementById('errorBox');
      const updateBtn = document.getElementById('updateBtn');

      if (!newPassword) {
        errorBox.textContent = '❌ Please enter a new password';
        errorBox.style.display = 'block';
        return;
      }

      if (!currentUser) {
        errorBox.textContent = '❌ Please check password first';
        errorBox.style.display = 'block';
        return;
      }

      try {
        updateBtn.disabled = true;
        updateBtn.textContent = 'Updating...';

        const userRef = doc(db, 'users', currentUser.id);
        await updateDoc(userRef, {
          password: newPassword,
          updatedAt: new Date()
        });

        resultBox.innerHTML = `
          <strong>✅ Password Updated Successfully!</strong><br><br>
          <div class="user-info">
            <div class="field"><strong>Email:</strong> ${currentUser.email}</div>
            <div class="field"><strong>New Password:</strong> <code style="background: #fef3c7; padding: 2px 6px; border-radius: 3px;">${newPassword}</code></div>
          </div>
          <p style="margin-top: 15px; color: #16a34a;">
            ✅ You can now use this password to login at the admin portal.
          </p>
        `;
        resultBox.style.display = 'block';
        errorBox.style.display = 'none';

        // Clear the update section
        document.getElementById('newPassword').value = '';

      } catch (error) {
        console.error('Error:', error);
        errorBox.textContent = `❌ Error updating password: ${error.message}`;
        errorBox.style.display = 'block';
      } finally {
        updateBtn.disabled = false;
        updateBtn.textContent = 'Update Password in Firestore';
      }
    };
  </script>
</body>
</html>
