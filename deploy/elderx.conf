server {
    server_name getcaremaster.com www.getcaremaster.com;

    root /var/www/caremaster/build;
    index index.html;

    # Security Headers at server level
    include /etc/nginx/snippets/security_headers.conf;

    # Serve existing .html files directly (test pages)
    location ~* \.html$ {
        include /etc/nginx/snippets/security_headers.conf;
        include /etc/nginx/snippets/csp_headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # API proxy to backend (no CSP — API returns JSON, not HTML)
    location /api {
        include /etc/nginx/snippets/security_headers.conf;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA fallback
    location / {
        include /etc/nginx/snippets/security_headers.conf;
        include /etc/nginx/snippets/csp_headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # NO CACHE for JS/CSS during debugging
    location ~* \.(js|css)$ {
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache images for 1 year
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security_headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/getcaremaster.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getcaremaster.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.getcaremaster.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = getcaremaster.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name getcaremaster.com www.getcaremaster.com;
    return 404;
}
