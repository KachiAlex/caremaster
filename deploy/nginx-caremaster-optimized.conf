# Gzip types for Care Master (gzip on is in global nginx.conf)
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript
    image/svg+xml;

server {
    server_name getcaremaster.com www.getcaremaster.com;

    root /var/www/caremaster/build;
    index index.html;

    # Security Headers
    include /etc/nginx/snippets/security_headers.conf;

    # index.html -- no cache
    location = /index.html {
        include /etc/nginx/snippets/security_headers.conf;
        include /etc/nginx/snippets/csp_headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Service worker -- no cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static assets (JS/CSS) -- CACHE for 1 year (immutable)
    location ~* \.(js|css)$ {
        include /etc/nginx/snippets/security_headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static media (images, fonts, etc) -- CACHE for 1 year
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security_headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SSE endpoint
    location /api/events {
        include /etc/nginx/snippets/security_headers.conf;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # API proxy
    location /api {
        include /etc/nginx/snippets/security_headers.conf;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA fallback
    location / {
        include /etc/nginx/snippets/security_headers.conf;
        include /etc/nginx/snippets/csp_headers.conf;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/getcaremaster.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getcaremaster.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Redirect HTTP to HTTPS
server {
    if ($host = www.getcaremaster.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = getcaremaster.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name getcaremaster.com www.getcaremaster.com;
    return 301 https://getcaremaster.com$request_uri;
}

# API Subdomain
server {
    server_name api.getcaremaster.com;
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.getcaremaster.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.getcaremaster.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
